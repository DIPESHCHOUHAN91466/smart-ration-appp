# Weekly dependency updates as pull requests. CI (tests, audits, gitleaks, semgrep) runs on each before anything
# is merged. Minor and patch updates are grouped per ecosystem to keep the PR count small; majors arrive one by one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend/SmartRation
    schedule: { interval: weekly, day: monday }
    groups: { python-minor: { update-types: [minor, patch] } }

  - package-ecosystem: pip
    directory: /ai
    schedule: { interval: weekly, day: monday }
    groups: { ai-minor: { update-types: [minor, patch] } }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups: { web-minor: { update-types: [minor, patch] } }

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: weekly, day: monday }
    groups: { e2e-minor: { update-types: [minor, patch] } }

  - package-ecosystem: pub
    directory: /smart_ration_mobile
    schedule: { interval: weekly, day: monday }
    groups: { app-minor: { update-types: [minor, patch] } }

  # Base images are pinned by digest in the Dockerfile; this keeps the digests current.
  - package-ecosystem: docker
    directory: /backend/SmartRation
    schedule: { interval: weekly, day: monday }

  # Actions are pinned to commit SHAs (with the version as a comment); this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ["*"] } }
