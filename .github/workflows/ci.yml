name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: backend/SmartRation
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only    # throwaway CI container, not a real secret
          MYSQL_DATABASE: smartration
          MYSQL_USER: smartration_app
          MYSQL_PASSWORD: ci-app-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql+pymysql://smartration_app:ci-app-only@127.0.0.1:3306/smartration?charset=utf8mb4
      JWT_SECRET_KEY: ci-only-signing-key-not-a-secret-0123456789abcdef
      LEGACY_API_URL: ""
      SEED_DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/SmartRation/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Create schema on MySQL 8, seed, verify
        run: python scripts/setup_database.py --seed
      - name: Setup is idempotent
        run: python scripts/setup_database.py --seed
      - name: Data integrity checks (database/queries, read-only; warnings also fail here)
        run: python scripts/check_data_integrity.py --strict
      - name: Cleanup worker runs against MySQL (dry run)
        run: python -m app.workers.cleanup --dry-run
      - name: Tests (unit, api, integration incl. live schema compatibility, security, performance budgets)
        run: python -m pytest
      - name: Create the separate test database (smartration_test)
        run: |
          mysql -h 127.0.0.1 -u root -pci-root-only -e "CREATE DATABASE smartration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL PRIVILEGES ON smartration_test.* TO 'smartration_app'@'%';"
      - name: MySQL suite (CRUD, injection, 1000 records, concurrency 10-100) on smartration_test
        env:
          TEST_DATABASE_URL: mysql+pymysql://smartration_app:ci-app-only@127.0.0.1:3306/smartration_test?charset=utf8mb4
        run: python -m pytest tests/integration/mysql_suite
      - name: Chatbot evaluation (en/hi/mr)
        run: python -m app.ai.chatbot.evaluate
      - name: Cross-component regression (C# / Python / JS contracts, tests/regression)
        working-directory: .
        run: python -m pytest tests/regression

  ai:
    name: AI service (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install -r requirements.txt ruff
      - name: Lint (ai/ruff.toml)
        run: python -m ruff check .
      - name: Tests (the package is imported as `ai` from the repository root; see ai/pytest.ini)
        run: python -m pytest

  csharp:
    name: C# API build + tests (SmartRation.sln)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build SmartRation.sln --configuration Release
      - run: dotnet test SmartRation.sln --configuration Release --no-build

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit and component tests (Vitest)
        run: npm test
      - run: npm run build

  android:
    name: Android app (Flutter analyze + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart_ration_mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Translations are generated from the .arb files and complete
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - name: Analyze
        run: flutter analyze
      - name: Tests (every screen in en/hi/mr on a small phone with large text; fake backend, camera, mic, speaker)
        run: flutter test

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Python API
        run: pip-audit -r backend/SmartRation/requirements-dev.txt --progress-spinner off
      - name: AI service
        run: pip-audit -r ai/requirements.txt --progress-spinner off
      - name: Frontend (production dependencies, high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: C# (including transitive packages)
        run: |
          dotnet restore SmartRation.sln
          dotnet list SmartRation.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  docker:
    name: Docker images (Python API + website, C# API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: python
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only    # throwaway CI container, not a real secret
          MYSQL_DATABASE: smartration
          MYSQL_USER: smartration_app
          MYSQL_PASSWORD: ci-app-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f backend/SmartRation/Dockerfile -t smartration-api:ci .
      - name: Image contains no secrets or env files
        run: |
          docker run --rm --entrypoint sh smartration-api:ci -c 'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/.venv && test -f /app/ai/chatbot/knowledge/faq.json && test -f /app/database/seeds/synthetic/shops.json && test -f /app/database/queries/01_overbooked_time_slots.sql && test -f /app/migrations/env.py && test -f /app/frontend-dist/index.html'
      # The first deploy on Render, reproduced: the same image, the entrypoint creating the schema and the demo data on
      # an empty MySQL 8, and the same non-secret settings as render.yaml (tests/regression/test_deploy_config.py keeps
      # them in step). Secret values here are CI-only dummies. Not reproduced: TLS to the database (MYSQL_SSL_CA).
      - name: First boot like Render (MySQL, migrations + seed), then live, ready, website and the demo citizen
        run: |
          docker run -d --name api --network host \
            -e ENVIRONMENT=production -e DATA_MODE=synthetic \
            -e "DATABASE_URL=mysql+pymysql://smartration_app:ci-app-only@127.0.0.1:3306/smartration?charset=utf8mb4" \
            -e JWT_SECRET_KEY=ci-only-signing-key-not-a-secret-0123456789abcdef \
            -e QR_SECRET=ci-only-qr-secret-not-a-secret-0123456789abcdef \
            -e MFA_ENCRYPTION_KEY=ci-only-mfa-key-not-a-secret-0123456789abcdef \
            -e DEMO_OTP_ENABLED=false -e SMS_ALLOW_MOCK_OUTSIDE_DEVELOPMENT=true \
            -e LEGACY_API_URL= -e AI_SERVICE_URL= \
            -e RUN_DB_SETUP=true -e RUN_DB_SEED=true -e SEED_DEMO_PASSWORD=ci-demo-password \
            smartration-api:ci
          # On failure: the container's last log lines as a public annotation (the app never logs secret values and
          # prints database URLs with the password hidden), so the cause is visible without opening the raw log.
          fail() {
            docker logs api > container.log 2>&1 || true
            echo "::error title=$1::$(tail -n 40 container.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          live() { for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8000/health/live > /dev/null && return 0; sleep 1; done; return 1; }
          live || fail "first boot: not live after 120 s"
          curl -s http://127.0.0.1:8000/ready | grep -q '"ready":true' || fail "first boot: /ready is not ready"
          curl -s http://127.0.0.1:8000/ready | grep -q '"legacyApi":"disabled"' || fail "first boot: the legacy API is not disabled"
          status=$(curl -s -o page.html -w "%{http_code}" http://127.0.0.1:8000/rural/dashboard)
          grep -q '<div id="root">' page.html || fail "website not served (HTTP $status)"
          token=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"email":"rural@example.com","password":"ci-demo-password"}' http://127.0.0.1:8000/api/auth/login \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['accessToken'])") || fail "demo citizen cannot sign in"
          echo "::add-mask::$token"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" http://127.0.0.1:8000/api/beneficiaries/me)
          [ "$code" = "200" ] || fail "demo citizen has no ration card (HTTP $code)"
          # A redeploy restarts the same container on the same database: setup must change nothing and start again.
          docker restart api > /dev/null
          live || fail "restart: not live after 120 s"
          curl -s http://127.0.0.1:8000/ready | grep -q '"ready":true' || fail "restart: /ready is not ready"
          docker logs api 2>&1 | grep -q "Nothing to seed" || fail "restart: the seed ran again"
      - name: Build the C# API image
        run: docker build -f backend/SmartRation.Api/Dockerfile -t smartration-csharp-api:ci .
      - name: C# image has no local database, dev settings or env files; runs as non-root
        run: |
          docker run --rm --entrypoint sh smartration-csharp-api:ci -c '! ls /app | grep -iE "\.db|Development|\.env" && test "$(id -u)" != "0"'
