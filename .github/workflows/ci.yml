name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: backend/SmartRation.Python
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only    # throwaway CI container, not a real secret
          MYSQL_DATABASE: smartration
          MYSQL_USER: smartration_app
          MYSQL_PASSWORD: ci-app-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql+pymysql://smartration_app:ci-app-only@127.0.0.1:3306/smartration?charset=utf8mb4
      JWT_SECRET_KEY: ci-only-signing-key-not-a-secret-0123456789abcdef
      LEGACY_API_URL: ""
      SEED_DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/SmartRation.Python/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Create schema on MySQL 8, seed, verify
        run: python scripts/setup_database.py --seed
      - name: Setup is idempotent
        run: python scripts/setup_database.py --seed
      - name: Tests (unit + live schema compatibility against MySQL)
        run: python -m pytest

  csharp:
    name: C# API tests (legacy, until retired)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test backend/SmartRation.Api.Tests/SmartRation.Api.Tests.csproj --configuration Release

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit and component tests (Vitest)
        run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f backend/SmartRation.Python/Dockerfile -t smartration-api:ci .
      - name: Image contains no secrets or env files
        run: |
          docker run --rm --entrypoint sh smartration-api:ci -c 'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/.venv && test -f /app/ai/chatbot/knowledge/faq.json && test -f /app/data/synthetic/reference/shops.json'
      - name: Container starts and is live
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e JWT_SECRET_KEY=ci-only-signing-key-not-a-secret-0123456789abcdef \
            -e LEGACY_API_URL= smartration-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/live && exit 0; sleep 1; done
          docker logs api; exit 1
