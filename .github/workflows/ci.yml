name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: backend/SmartRation
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only    # throwaway CI container, not a real secret
          MYSQL_DATABASE: smartration
          MYSQL_USER: smartration_app
          MYSQL_PASSWORD: ci-app-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql+pymysql://smartration_app:ci-app-only@127.0.0.1:3306/smartration?charset=utf8mb4
      JWT_SECRET_KEY: ci-only-signing-key-not-a-secret-0123456789abcdef
      LEGACY_API_URL: ""
      SEED_DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/SmartRation/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Create schema on MySQL 8, seed, verify
        run: python scripts/setup_database.py --seed
      - name: Setup is idempotent
        run: python scripts/setup_database.py --seed
      - name: Cleanup worker runs against MySQL (dry run)
        run: python -m app.workers.cleanup --dry-run
      - name: Tests (unit, api, integration incl. live schema compatibility, security, performance budgets)
        run: python -m pytest
      - name: Create the separate test database (smartration_test)
        run: |
          mysql -h 127.0.0.1 -u root -pci-root-only -e "CREATE DATABASE smartration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL PRIVILEGES ON smartration_test.* TO 'smartration_app'@'%';"
      - name: MySQL suite (CRUD, injection, 1000 records, concurrency 10-100) on smartration_test
        env:
          TEST_DATABASE_URL: mysql+pymysql://smartration_app:ci-app-only@127.0.0.1:3306/smartration_test?charset=utf8mb4
        run: python -m pytest tests/integration/mysql_suite
      - name: Chatbot evaluation (en/hi/mr)
        run: python -m app.ai.chatbot.evaluate

  ai:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/SmartRation.AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/SmartRation.AI/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest

  csharp:
    name: C# API build + tests (SmartRation.sln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build SmartRation.sln --configuration Release
      - run: dotnet test SmartRation.sln --configuration Release --no-build

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit and component tests (Vitest)
        run: npm test
      - run: npm run build

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Python API
        run: pip-audit -r backend/SmartRation/requirements-dev.txt --progress-spinner off
      - name: AI service
        run: pip-audit -r backend/SmartRation.AI/requirements.txt --progress-spinner off
      - name: Frontend (production dependencies, high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: C# (including transitive packages)
        run: |
          dotnet restore SmartRation.sln
          dotnet list SmartRation.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  docker:
    name: Docker images (Python API + website, C# API)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f backend/SmartRation/Dockerfile -t smartration-api:ci .
      - name: Image contains no secrets or env files
        run: |
          docker run --rm --entrypoint sh smartration-api:ci -c 'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/.venv && test -f /app/ai/chatbot/knowledge/faq.json && test -f /app/data/synthetic/reference/shops.json && test -f /app/frontend-dist/index.html'
      - name: Container starts, is live and serves the website
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e JWT_SECRET_KEY=ci-only-signing-key-not-a-secret-0123456789abcdef \
            -e LEGACY_API_URL= smartration-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health/live || { docker logs api; exit 1; }
          curl -fsS http://127.0.0.1:8000/rural/dashboard | grep -q '<div id="root">' || { docker logs api; exit 1; }
      - name: Build the C# API image
        run: docker build -f backend/SmartRation.Api/Dockerfile -t smartration-csharp-api:ci .
      - name: C# image has no local database, dev settings or env files; runs as non-root
        run: |
          docker run --rm --entrypoint sh smartration-csharp-api:ci -c '! ls /app | grep -iE "\.db|Development|\.env" && test "$(id -u)" != "0"'
