[pytest]
testpaths =
    ai/tests
    backend/SmartRation/tests
    tests/integration/mysql
    tests/regression

# Each backend is importable from here (the gateway as `app`, the AI service as `ai` from the repository
# root), and so are the uniquely named test helper modules (ai_testkit, py_testkit, mysql_suite.*).
# Run with the Python backend's virtualenv, which has every package both backends need:
#   backend\SmartRation\.venv\Scripts\python -m pytest
# tests/smoke is not listed: it needs a running deployment (pytest tests/smoke --base-url URL).
pythonpath =
    .
    backend/SmartRation
    backend/SmartRation/tests
    backend/SmartRation/tests/integration
    ai/tests
    tests/integration/mysql

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Import test files by path so the two backends' tests folders can coexist without __init__.py.
addopts = --import-mode=importlib -p no:cacheprovider
