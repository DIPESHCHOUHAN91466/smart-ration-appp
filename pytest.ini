[pytest]
testpaths =
    backend/SmartRation.AI/tests
    backend/SmartRation.Python/tests
    tests/mysql

# Each backend is importable from here, and so are the uniquely named test helper modules
# (ai_testkit, py_testkit, mysql_suite.*). Run with the Python backend's virtualenv, which has
# every package both backends need:
#   backend\SmartRation.Python\.venv\Scripts\python -m pytest
pythonpath =
    backend/SmartRation.Python
    backend/SmartRation.Python/tests
    backend/SmartRation.AI
    backend/SmartRation.AI/tests
    tests/mysql

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Import test files by path so the two backends' tests folders can coexist without __init__.py.
addopts = --import-mode=importlib -p no:cacheprovider
