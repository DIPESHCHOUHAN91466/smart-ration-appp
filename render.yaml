# Render Blueprint: Smart Ration HSD2C as a public SYNTHETIC-DATA demo.
# Step-by-step guide: docs/deployment/RENDER.md
#
#   smart-ration-hsd2c       public web service: the website + Python API (the address you share)
#   smart-ration-hsd2c-core  web service: the C# business API (only the Python service calls it)
#   MySQL 8                  NOT on Render (Render has no MySQL): use e.g. Aiven's free MySQL and
#                            paste its details when Render asks (DATABASE_URL, MYSQL_SSL_CA)
#
# First deploy on an empty database: the C# API creates the schema and seeds synthetic demo data; the
# Python service waits for it (WAIT_FOR_LEGACY_API), then verifies and adopts that schema (RUN_DB_SETUP).
# Secrets are never in this file: JWT_SECRET_KEY and Qr__Secret are generated by Render; the database
# details are typed into the Render Dashboard (sync: false).

envVarGroups:
  - name: smart-ration-shared
    envVars:
      - key: JWT_SECRET_KEY          # both backends sign/verify the same login tokens
        generateValue: true
      - key: DATA_MODE
        value: synthetic

services:
  - type: web
    name: smart-ration-hsd2c-core
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/SmartRation.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: smart-ration-shared
      - key: DATABASE_URL            # mysql+pymysql://USER:PASSWORD@HOST:PORT/DB?charset=utf8mb4&ssl_ca=/tmp/mysql-ca.pem
        sync: false
      - key: MYSQL_SSL_CA            # the database provider's CA certificate (PEM text, "-----BEGIN CERTIFICATE-----...")
        sync: false
      - key: Qr__Secret              # signs QR tokens; changing it invalidates issued QR codes
        generateValue: true
      - key: Demo__DemoOtpEnabled
        value: "false"
      - key: Sms__AllowMockOutsideDevelopment   # synthetic demo: OTP SMS are NOT delivered (logged as a warning)
        value: "true"
      - key: AiService__BaseUrl                 # the optional AI analytics service is not deployed
        value: ""

  - type: web
    name: smart-ration-hsd2c
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/SmartRation.Python/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: smart-ration-shared
      - key: DATABASE_URL            # same database, copied from the C# service (typed in once)
        fromService:
          name: smart-ration-hsd2c-core
          type: web
          envVarKey: DATABASE_URL
      - key: MYSQL_SSL_CA
        fromService:
          name: smart-ration-hsd2c-core
          type: web
          envVarKey: MYSQL_SSL_CA
      - key: LEGACY_API_URL          # the C# service's public host name (free services can't use the private network)
        fromService:
          name: smart-ration-hsd2c-core
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: WAIT_FOR_LEGACY_API     # don't touch the database until the C# API has created the schema
        value: "true"
      - key: RUN_DB_SETUP
        value: "true"
      - key: RUN_DB_SEED
        value: "true"
      - key: AI_SERVICE_URL
        value: ""
      - key: VITE_DEMO_MODE          # build-time: the login page offers the synthetic demo accounts
        value: "true"
