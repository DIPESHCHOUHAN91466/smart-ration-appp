# Render Blueprint: Smart Ration HSD2C as a public SYNTHETIC-DATA demo.
# Step-by-step guide: docs/deployment/RENDER.md
#
#   smart-ration-hsd2c   public web service: the website + Python API (the address you share)
#   MySQL 8              NOT on Render (Render has no MySQL): use e.g. Aiven's free MySQL, create a database
#                        named "smartration" in it, and paste its details when Render asks
#
# First deploy on an empty database: the container creates the schema with the Alembic migrations, loads the
# synthetic reference data and the three demo accounts (RUN_DB_SETUP, RUN_DB_SEED, SEED_DEMO_PASSWORD), then
# starts. Later deploys only apply new migrations; nothing is ever dropped.
# The old C# API (backend/SmartRation.Api) is retired: every route is served by the Python backend.
# Secrets are never in this file: JWT_SECRET_KEY, QR_SECRET and MFA_ENCRYPTION_KEY are generated by Render; the database details
# and the demo password are typed into the Render Dashboard (sync: false).

services:
  - type: web
    name: smart-ration-hsd2c
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/SmartRation/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass  # deploy a push to main only after the GitHub CI checks pass
    envVars:
      - key: ENVIRONMENT             # production rules: no fixed demo OTP, no silent mock SMS (see app/config/settings.py)
        value: production
      - key: DATA_MODE
        value: synthetic
      - key: DATABASE_URL            # mysql+pymysql://USER:PASSWORD@HOST:PORT/smartration?charset=utf8mb4&ssl_ca=/tmp/mysql-ca.pem
        sync: false
      - key: MYSQL_SSL_CA            # the database provider's CA certificate (PEM text, "-----BEGIN CERTIFICATE-----...")
        sync: false
      - key: JWT_SECRET_KEY          # signs login tokens
        generateValue: true
      - key: QR_SECRET               # signs QR tokens; NEVER change it after the first deploy (it invalidates every issued QR)
        generateValue: true
      - key: MFA_ENCRYPTION_KEY      # encrypts staff two-factor secrets; NEVER change it once staff use two-factor sign-in
        generateValue: true
      - key: TRUSTED_PROXY_HOPS      # Render's edge appends the client, its proxy appends itself: client = 2nd from the right
        value: "2"
      - key: DEMO_OTP_ENABLED
        value: "false"
      - key: SMS_ALLOW_MOCK_OUTSIDE_DEVELOPMENT   # synthetic demo: sign-in codes are NOT delivered (no SMS gateway)
        value: "true"
      - key: LEGACY_API_URL          # empty: the retired C# API is not used
        value: ""
      - key: AI_SERVICE_URL          # empty: the optional AI analytics service is not deployed
        value: ""
      - key: RUN_DB_SETUP
        value: "true"
      - key: RUN_DB_SEED
        value: "true"
      - key: SEED_DEMO_PASSWORD      # password of the 3 synthetic demo accounts, created on the first deploy only
        sync: false
      - key: VITE_DEMO_MODE          # build-time: the login page offers the synthetic demo accounts
        value: "true"
