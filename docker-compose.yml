# Smart Ration: MySQL 8 + the Python API.
#
#   copy deployment\docker\compose.env.example .env     (then fill in the values; .env is git-ignored)
#   docker compose up --build
#
# The API is on http://localhost:8000 (/health, /ready, /docs). Routes not yet migrated are
# proxied to the C# API, which still runs on the host (LEGACY_API_URL). The MySQL data lives
# in the named volume "mysql-data"; `docker compose down` keeps it, `down -v` DELETES it.
name: smartration

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: smartration
      MYSQL_USER: ${MYSQL_USER:-smartration_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"   # 3307 so it doesn't clash with a host MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Uses the app account so the password never appears in the process list via -p on root.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .                                   # repo root: the image needs ai/ and data/ too
      dockerfile: backend/SmartRation/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smartration_app}:${MYSQL_PASSWORD}@mysql:3306/smartration?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (the same value as the C# Jwt:Key)}
      LEGACY_API_URL: ${LEGACY_API_URL:-http://host.docker.internal:5188}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_DB_SETUP: "true"                  # create/adopt/upgrade the schema on start (never drops data)
      RUN_DB_SEED: ${RUN_DB_SEED:-false}    # synthetic data into empty tables
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mysql-data:
