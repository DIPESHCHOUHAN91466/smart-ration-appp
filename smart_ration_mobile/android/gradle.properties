# 2 GB is enough for this app and leaves room for the emulator on an 8 GB PC (the template default was 8 GB).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle process instead of starting a second ~1 GB background process.
kotlin.compiler.execution.strategy=in-process
# Plugin code lives in the pub cache on C: while this project builds on D:. Kotlin's incremental
# compiler fails on Windows across two drives ("Could not close incremental caches"), so it is off.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
