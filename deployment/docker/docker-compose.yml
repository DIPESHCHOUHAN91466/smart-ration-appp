# Smart Ration on one machine: MySQL 8 + the C# business API + the Python gateway (which also serves the
# website) — the same two images and start-up order as render.yaml, with a local database.
#
#   copy deployment\docker\compose.env.example deployment\docker\.env      (fill in; .env is git-ignored)
#   docker compose -f deployment/docker/docker-compose.yml up --build
#
# Website + API: http://localhost:8000 (/health, /ready, /docs). C# API: http://localhost:5188/api/health.
# Start-up order: MySQL healthy -> C# API creates/updates the schema (EF history) and seeds synthetic demo
# data -> the gateway waits for the C# health endpoint, adopts the schema with Alembic, then starts.
# MySQL data lives in the named volume "mysql-data"; `docker compose down` keeps it, `down -v` DELETES it.
name: smartration

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deployment/docker/.env}
      MYSQL_DATABASE: smartration
      MYSQL_USER: ${MYSQL_USER:-smartration_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deployment/docker/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"   # 3307 so it doesn't clash with a host MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Uses the app account so the password never appears in the process list via -p on root.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  core:                                            # C# business API (bookings, QR, OTP, stock, collections)
    build:
      context: ../..                               # repo root (.dockerignore is an allow-list)
      dockerfile: backend/SmartRation.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATA_MODE: synthetic
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smartration_app}:${MYSQL_PASSWORD}@mysql:3306/smartration?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in deployment/docker/.env}
      Qr__Secret: ${QR_SECRET:?set QR_SECRET in deployment/docker/.env}
      Demo__DemoOtpEnabled: "false"
      Sms__AllowMockOutsideDevelopment: "true"     # synthetic demo: OTP SMS are logged, not sent
      AiService__BaseUrl: ""
    ports:
      - "127.0.0.1:5188:8080"

  api:                                             # Python gateway + the built website
    build:
      context: ../..
      dockerfile: backend/SmartRation/Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATA_MODE: synthetic
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smartration_app}:${MYSQL_PASSWORD}@mysql:3306/smartration?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      QR_SECRET: ${QR_SECRET:?set QR_SECRET in deployment/docker/.env}   # signs booking QR codes; the API refuses to start without it
      LEGACY_API_URL: http://core:8080
      WAIT_FOR_URL: http://core:8080/api/health    # don't touch the database before the C# API has migrated it
      AI_SERVICE_URL: ""
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_DB_SETUP: "true"                          # adopt/upgrade the schema on start (never drops data)
      RUN_DB_SEED: ${RUN_DB_SEED:-true}             # synthetic reference data into empty tables only
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mysql-data:
