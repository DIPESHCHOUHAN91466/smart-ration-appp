<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smart Ration AI">
  <!-- Derived from the Ration Mitra mark (src/assets/ration-mitra-logo.webp): leaf sprig, caring arc, AI spark. -->
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A6ED1"/>
      <stop offset="1" stop-color="#063B7A"/>
    </linearGradient>
    <linearGradient id="av-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="av-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16B8E8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#av-bg)"/>
  <!-- caring arc -->
  <path d="M13 38c4 10 13 15 23 14 8-1 14-6 16-12" fill="none" stroke="url(#av-arc)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- leaf sprig -->
  <path d="M22 44V21" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M22 26c-6-1-8-5-8-9 5 0 8 3 8 9Z" fill="url(#av-leaf)"/>
  <path d="M22 26c6-1 8-5 8-9-5 0-8 3-8 9Z" fill="url(#av-leaf)"/>
  <path d="M22 35c-6-1-9-5-9-9 5 0 9 3 9 9Z" fill="url(#av-leaf)"/>
  <path d="M22 35c6-1 9-5 9-9-5 0-9 3-9 9Z" fill="url(#av-leaf)"/>
  <!-- AI -->
  <text x="42.5" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="15" fill="#ffffff">AI</text>
  <!-- spark -->
  <path d="M49 12l1.6 4.4L55 18l-4.4 1.6L49 24l-1.6-4.4L43 18l4.4-1.6Z" fill="#bae6fd"/>
</svg>
