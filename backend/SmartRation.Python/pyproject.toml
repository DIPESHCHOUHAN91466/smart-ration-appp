# Tool configuration only (the app is not packaged). Dependencies: requirements*.txt.

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [".venv", "app/db/migrations/versions"]  # migrations are autogenerated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends(...) in argument defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # expected JSON bodies read best on one line

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
