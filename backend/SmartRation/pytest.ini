[pytest]
testpaths = tests
# importlib + pythonpath: tests import helpers by unique module names (py_testkit, mysql_suite.*),
# so the tests folder needs no __init__.py and the same files also run from the repository root.
pythonpath = . tests
addopts = -q -p no:cacheprovider --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
